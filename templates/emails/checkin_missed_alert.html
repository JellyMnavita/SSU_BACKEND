{% extends "emails/base_email.html" %}
{% block content %}
<h2 style="color:#dc2626;margin:0 0 12px;">Check-in manqué</h2>
<p>Bonjour {{ contact_name }},</p>
<p><strong>{{ initiator_name }}</strong> n'a pas confirmé son check-in sécurité à l'heure prévue.</p>
<p style="margin:24px 0;">
  <a href="{{ track_url }}" style="background:#dc2626;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600;">
    Voir la dernière position connue
  </a>
</p>
<p style="font-size:13px;color:#666;">Si le bouton ne fonctionne pas, copiez ce lien :<br>{{ track_url }}</p>
{% endblock %}
